name: KiCad schematic exports

on:
  push:
    paths:
      - "Beal-Rx/**"
      - "Beal-TX/**"
      - "Beal-Common/**"
      - "scripts/jlcpcb-export.py"
      - ".github/workflows/kicad-schematic-pdf.yml"
  pull_request:
    paths:
      - "Beal-Rx/**"
      - "Beal-TX/**"
      - "Beal-Common/**"
      - "scripts/jlcpcb-export.py"
      - ".github/workflows/kicad-schematic-pdf.yml"
  workflow_dispatch:

jobs:
  schematic-pdf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Beal-RX
            dir: Beal-Rx
          - name: Beal-TX
            dir: Beal-TX
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run KiCad actions
        uses: actions-for-kicad/kicad-actions@v2-k10.0
        with:
          project_file_name: ./${{ matrix.dir }}/${{ matrix.name }}.kicad_pro
          schematic_file_name: ./${{ matrix.dir }}/${{ matrix.name }}.kicad_sch
          schematic_output_pdf: true
          schematic_output_pdf_file_name: ${{ matrix.name }}-schematic.pdf
          schematic_output_bom: true
          schematic_output_bom_file_name: ${{ matrix.name }}-bom.csv
          schematic_output_bom_fields: "Reference,Value,MPN,Footprint,${QUANTITY},${DNP}"
          schematic_output_bom_labels: "Refs,Value,MPN,Footprint,Qty,DNP"

      - name: Upload outputs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-outputs
          path: |
            ${{ matrix.name }}-schematic.pdf
            ${{ matrix.name }}-bom.csv

  jlcpcb:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Beal-RX
            dir: Beal-Rx
          - name: Beal-TX
            dir: Beal-TX
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Export JLCPCB files
        run: python3 scripts/jlcpcb-export.py ${{ matrix.dir }}/${{ matrix.name }}.kicad_pro jlcpcb

      - name: Upload JLCPCB files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-jlcpcb
          path: jlcpcb/
